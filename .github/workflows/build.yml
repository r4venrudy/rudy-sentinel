name: Build and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Restore pinned SDK and WDK
        run: nuget restore packages.config -PackagesDirectory packages -NonInteractive
      - name: Build C kernel sensor (unsigned)
        run: msbuild sensor/RudySensor.vcxproj /p:Configuration=Release /p:Platform=x64 /m
      - name: Build C++ agent and C queue tests
        run: |
          cmake -S . -B build/native -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/native --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/native -C Release --output-on-failure
      - name: Build C# console and test investigation model
        run: |
          dotnet build console/RudySentinel.Console.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Console.Tests -c Release
      - name: Replay synthetic events and render real desktop console
        shell: pwsh
        run: |
          build/native/Release/rudy-sentinel.exe --replay examples/demo.ndjson --out artifacts/demo --rules rules/default.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet console/bin/Release/net10.0-windows/RudySentinel.Console.dll --data artifacts/demo --snapshot artifacts/console.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path artifacts/console.png)) { throw 'Console render failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-research-build
          path: |
            artifacts/sensor/Release/RudySensor.sys
            build/native/Release/rudy-sentinel.exe
            console/bin/Release/net10.0-windows/
            artifacts/demo/
            artifacts/console.png
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with sanitizers
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Replay verification
        run: ./build/rudy-sentinel --replay examples/demo.ndjson --rules rules/default.json --out run
